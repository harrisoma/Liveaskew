name: E2E Privacy SSR

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'

jobs:
  e2e-privacy-ssr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run E2E SSR test
        env:
          ARTIFACT_DIR: ${{ github.workspace }}/e2e-artifacts
        run: ./scripts/e2e-privacy-ssr.sh

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: privacy-ssr-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: e2e-artifacts/
          if-no-files-found: warn
          retention-days: 14
