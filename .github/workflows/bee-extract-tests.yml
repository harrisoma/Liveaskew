name: Bee Extract Unit Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  bee-extract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run bee-extract unit tests
        run: bunx vitest run src/lib/bee-extract.test.ts
